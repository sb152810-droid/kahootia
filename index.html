<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Школа-Табір: Грандіозна Вікторина</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #1a1a2e; padding: 30px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border: 2px solid #ffcc00; }
        h1 { color: #ffcc00; margin-bottom: 10px; }
        .screen { display: none; }
        .active { display: block; }
        input, select, button { width: 100%; padding: 14px; margin: 12px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        input, select { background: #16213e; color: #fff; border: 1px solid #0f3460; }
        button { background: #ffcc00; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #e6b800; transform: scale(1.02); }
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .ans-btn { background: #e94560; color: #white; padding: 20px; font-size: 18px; border-radius: 12px; cursor: pointer; border: none; font-weight: bold; }
        .ans-btn:nth-child(2) { background: #0f3460; }
        .ans-btn:nth-child(3) { background: #533483; }
        .ans-btn:nth-child(4) { background: #00b4d8; }
        .leaderboard { background: #16213e; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: left; }
        .lb-item { display: flex; justify-content: space-between; padding: 8px 12px; margin: 5px 0; background: #0f3460; border-radius: 6px; }
        .timer { font-size: 24px; color: #ffcc00; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ЕКРАН 1: Головне меню -->
        <div id="screen-menu" class="screen active">
            <h1>🏕️ Школа-Табір: Арена Ігор</h1>
            <p style="color: #aaa;">Обери режим табірного змагання з власними ботами!</p>
            
            <input type="text" id="playerName" placeholder="Введи своє ім'я (наприклад, Аня чи Марія)" value="Аня">
            
            <label style="float: left; color: #aaa; font-size: 14px;">Режим гри:</label>
            <select id="gameMode">
                <option value="escape">🤖 Втеча від Табірного Робота</option>
                <option value="hackers">💻 Хакери проти системи</option>
                <option value="treasure">💎 Полювання на діаманти табору</option>
            </select>

            <button onclick="startGame()">Розпочати свято!</button>
        </div>

        <!-- ЕКРАН 2: Сама гра (питання + боти) -->
        <div id="screen-game" class="screen">
            <div class="timer" id="timer">Час: 15</div>
            <h3 id="questionText" style="font-size: 22px; min-height: 60px;">Питання завантажується...</h3>
            
            <div class="answers-grid">
                <button class="ans-btn" onclick="checkAnswer(0)" id="btn0">Варіант 1</button>
                <button class="ans-btn" onclick="checkAnswer(1)" id="btn1">Варіант 2</button>
                <button class="ans-btn" onclick="checkAnswer(2)" id="btn2">Варіант 3</button>
                <button class="ans-btn" onclick="checkAnswer(3)" id="btn3">Варіант 4</button>
            </div>

            <div class="leaderboard">
                <h4 style="margin: 0 0 10px 0; color: #ffcc00;">🏆 Таблиця лідерів (Ти + Табірні Боти):</h4>
                <div id="lbList"></div>
            </div>
        </div>

        <!-- ЕКРАН 3: Фінал -->
        <div id="screen-win" class="screen">
            <h1>🎉 Фінал свята!</h1>
            <h2 id="winMessage" style="color: #ffcc00;"></h2>
            <div class="leaderboard" id="finalLb"></div>
            <button onclick="location.reload()" style="margin-top: 20px;">Зіграти ще раз</button>
        </div>
    </div>

    <script>
        // Список наших власних розумних табірних ботів з різними характерами
        let players = [
            { name: "Аня (Ти)", score: 0, isBot: false },
            { name: "🤖 Бот_Кіт_Батон", score: 0, isBot: true, smartness: 0.7 }, // Розумний бот
            { name: "💻 Хакер_Макс", score: 0, isBot: true, smartness: 0.5 },    // Середній
            { name: "👻 Табірний_Привид", score: 0, isBot: true, smartness: 0.3 }, // Часто помиляється
            { name: "⚡ Енерджайзер", score: 0, isBot: true, smartness: 0.6 }
        ];

        // Наша власна база питань для школи-табору
        const questions = [
            {
                q: "Яка головна мета учасників у нашому таборі?",
                answers: ["Вижити й отримати грамоту", "Спати до обіду", "З'їсти весь запас печива", "Побудувати ракету"],
                correct: 0
            },
            {
                q: "Що робить справжній таборянин, коли чує ранковий підйом?",
                answers: ["Співає гімн", "Робить вигляд, що спить", "Шукає телефон", "Бере скрипку"],
                correct: 1
            },
            {
                q: "Який предмет найважливіший для онлайн-уроків?",
                answers: ["Каструля", "Wi-Fi та терпіння", "Кіт", "Лінійка"],
                correct: 1
            },
            {
                q: "Скільки годин триває ідеальна перерва між квестами?",
                answers: ["5 хвилин", "Вічність", "Ровно 10 хвилин", "Ніколи не закінчується"],
                correct: 2
            },
            {
                q: "Хто головний режисер цього крутого свята?",
                answers: ["Директор школи", "Аня та Марія", "Погода", "Інопланетяни"],
                correct: 1
            }
        ];

        let currentQIndex = 0;
        let timeLeft = 15;
        let timerInterval;
        let botInterval;

        function startGame() {
            const userName = document.getElementById('playerName').value.trim();
            if (userName) players[0].name = `${userName} (Ти)`;
            
            // Змінюємо екран
            document.getElementById('screen-menu').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');

            loadQuestion();
        }

        function loadQuestion() {
            if (currentQIndex >= questions.length) {
                endGame();
                return;
            }

            timeLeft = 15;
            document.getElementById('timer').innerText = `Час: ${timeLeft}`;
            
            const q = questions[currentQIndex];
            document.getElementById('questionText').innerText = `Питання ${currentQIndex + 1}: ${q.q}`;
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).innerText = q.answers[i];
                document.getElementById(`btn${i}`).disabled = false;
            }

            updateLeaderboard();

            // Запускаємо таймер секундоміра
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `Час: ${timeLeft}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);

            // БОТИ ПОЧИНАЮТЬ ДУМАТИ І ГРАТИ САМІ!
            startBotsThinking(q.correct);
        }

        function startBotsThinking(correctIndex) {
            clearInterval(botInterval);
            
            // Кожен бот обирає випадковий час на "роздуми" (від 2 до 9 секунд)
            players.forEach(p => {
                if (p.isBot) {
                    let thinkTime = Math.random() * 6000 + 2000;
                    setTimeout(() => {
                        if (timeLeft > 0) {
                            // Перевіряємо кмітливість бота: чи дасть правильну відповідь
                            let chosenAns;
                            if (Math.random() < p.smartness) {
                                chosenAns = correctIndex; // Правильна
                            } else {
                                chosenAns = Math.floor(Math.random() * 4); // Помиляється
                            }

                            if (chosenAns === correctIndex) {
                                p.score += 250; // Нараховуємо бали боту
                            }
                            updateLeaderboard();
                        }
                    }, thinkTime);
                }
            });
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const q = questions[currentQIndex];

            // Вимикаємо кнопки на цей раунд
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            if (selectedIndex === q.correct) {
                players[0].score += 300 + timeLeft * 10; // Бонус за швидкість для тебе
                alert('🎉 Правильно! Ти заробила бали!');
            } else {
                alert('❌ Ой, трішки не туди! Але нічого, боти теж помиляються.');
            }

            nextQuestion();
        }

        function nextQuestion() {
            currentQIndex++;
            loadQuestion();
        }

        function updateLeaderboard() {
            // Сортуємо гравців і ботів за балами (хто вище)
            players.sort((a, b) => b.score - a.score);

            let html = '';
            players.forEach((p, index) => {
                let badge = index === 0 ? '👑' : `#${index + 1}`;
                html += `<div class="lb-item"><span>${badge} ${p.name}</span> <b>${p.score} очок</b></div>`;
            });
            document.getElementById('lbList').innerHTML = html;
        }

        function endGame() {
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-win').classList.add('active');

            players.sort((a, b) => b.score - a.score);
            document.getElementById('winMessage').innerText = `Переможець гри: ${players[0].name} !`;

            let html = '';
            players.forEach((p, index) => {
                html += `<div class="lb-item"><span>Місце ${index + 1}: ${p.name}</span> <b>${p.score} очок</b></div>`;
            });
            document.getElementById('finalLb').innerHTML = html;
        }
    </script>
</body>
</html>
