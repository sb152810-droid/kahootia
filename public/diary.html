<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Щоденник · SunLorem</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>
  <div class="container">
    <div class="card">
      <h2>📔 Щоденник і оцінки</h2>
      <p id="avgText" style="margin-bottom:14px; color:#78350f;"></p>
      <div id="gradesList"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const user = await renderTopbar('/diary');
      if (!user) return;

      const r = await api('/api/diary');
      const grades = r.grades || [];
      const list = document.getElementById('gradesList');

      if (!grades.length) {
        list.innerHTML = '<p style="color:#999;">Оцінок ще немає 😊</p>';
        return;
      }

      const sorted = [...grades].sort((a, b) => new Date(b.date) - new Date(a.date));
      const sum = sorted.reduce((s, g) => s + Number(g.grade || 0), 0);
      const avg = (sum / sorted.length).toFixed(2);
      document.getElementById('avgText').textContent = `Середній бал: ${avg} · Всього оцінок: ${sorted.length}`;

      list.innerHTML = sorted
        .map((g) => {
          const d = new Date(g.date).toLocaleDateString('uk-UA');
          return `<div class="grade-item">
            <div>
              <b>${g.subject}</b>
              <div style="font-size:12px; color:#78350f;">${d}${g.comment ? ' · ' + g.comment : ''}</div>
            </div>
            <span class="grade-num">${g.grade}</span>
          </div>`;
        })
        .join('');
    })();
  </script>
</body>
</html>
