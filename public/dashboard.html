<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Кабінет учня · SunLorem</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>
  <div class="container">
    <div class="card">
      <h2>🏠 Мій кабінет</h2>
      <p>Привіт, <b id="myName">…</b>! Гарного навчання 🌞</p>
      <h3 class="mt-20">💰 Мої монети: <span id="myCoins" style="color:#ea580c;">0</span></h3>
    </div>

    <div class="card">
      <h2>🎯 Швидкі дії</h2>
      <a class="btn" href="/quiz">🧠 Пройти вікторину</a>
      <a class="btn secondary" href="/diary">📔 Щоденник</a>
      <a class="btn secondary" href="/schedule">📅 Розклад і ДЗ</a>
      <a class="btn secondary" href="/chat">💬 Шкільний чат</a>
    </div>

    <div class="card">
      <h2>🏆 Лідери класу</h2>
      <div id="leaders"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const user = await renderTopbar('/dashboard');
      if (!user) return;

      const classRes = await api('/api/class');
      const me = [...(classRes.students || []), ...(classRes.bots || [])].find(
        (p) => p.name === user.name
      );
      document.getElementById('myName').textContent = user.name || user.username;
      document.getElementById('myCoins').textContent = me ? me.coins : 0;

      const all = [...(classRes.students || []), ...(classRes.bots || [])].sort(
        (a, b) => b.coins - a.coins
      );
      const leaders = document.getElementById('leaders');
      leaders.innerHTML = all.length
        ? all
            .slice(0, 10)
            .map((p, i) => {
              const cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
              const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
              return `<div class="leaderboard-item ${cls}">
                <span>${medal} ${p.isBot ? '🤖 ' : '🧑‍🎓 '}${p.name}</span>
                <span>${p.coins} 💰</span>
              </div>`;
            })
            .join('')
        : '<p>Немає даних</p>';
    })();
  </script>
</body>
</html>
