<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Панель вчителя · SunLorem</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>

  <div class="container">
    <div class="card">
      <h2>👩‍🏫 Панель вчителя</h2>
      <p>Керуйте класом, ботами та оцінками.</p>
    </div>

    <!-- МАСОВЕ ДОДАВАННЯ БОТІВ -->
    <div class="card">
      <h2>🤖 Масове додавання ботів</h2>
      <p style="font-size:14px; color:#78350f; margin-bottom:10px;">
        Введіть імена через кому — всі вони одразу додадуться до класу.
      </p>
      <textarea id="botNames" placeholder="Наприклад: КіберКотик, Піфагорчик, МегаМозок, Розумник"></textarea>
      <button class="btn" onclick="addBotsBulk()">➕ Додати ботів</button>
      <p id="botMsg" class="success"></p>
    </div>

    <!-- СПИСОК КЛАСУ -->
    <div class="card">
      <h2>👥 Клас</h2>
      <h3>🧑‍🎓 Реальні учні</h3>
      <div id="studentsList" class="grid"></div>
      <h3 class="mt-20">🤖 Боти-однокласники</h3>
      <div id="botsList" class="grid"></div>
    </div>

    <!-- ВИСТАВЛЕННЯ ОЦІНОК -->
    <div class="card">
      <h2>📔 Виставити оцінку</h2>
      <select id="gradeStudent"></select>
      <input id="gradeSubject" type="text" placeholder="Предмет (напр. Математика)" />
      <input id="gradeValue" type="number" min="1" max="12" placeholder="Оцінка (1–12)" />
      <input id="gradeComment" type="text" placeholder="Коментар (необов'язково)" />
      <button class="btn" onclick="giveGrade()">💾 Зберегти</button>
      <p id="gradeMsg" class="success"></p>
    </div>

    <!-- РОЗКЛАД / ДЗ -->
    <div class="card">
      <h2>📅 Додати урок / ДЗ</h2>
      <input id="schDay" type="text" placeholder="День (Понеділок)" />
      <input id="schTime" type="text" placeholder="Час (09:00–09:45)" />
      <input id="schSubject" type="text" placeholder="Предмет" />
      <input id="schHw" type="text" placeholder="Домашнє завдання (необов'язково)" />
      <button class="btn" onclick="addSchedule()">➕ Додати</button>
      <p id="schMsg" class="success"></p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let classData = { students: [], bots: [] };

    async function refreshClass() {
      const r = await api('/api/class');
      if (!r.ok) return;
      classData = r;

      const sl = document.getElementById('studentsList');
      sl.innerHTML = r.students.length
        ? r.students
            .map(
              (s) =>
                `<div class="user-card"><span class="name">🧑‍🎓 ${s.name}</span><span class="coins">${s.coins} 💰</span></div>`
            )
            .join('')
        : '<p style="color:#999;">Немає учнів</p>';

      const bl = document.getElementById('botsList');
      bl.innerHTML = r.bots.length
        ? r.bots
            .map(
              (b) =>
                `<div class="user-card bot">
                   <span class="name">🤖 ${b.name}<span class="tag">BOT</span></span>
                   <span style="display:flex;gap:8px;align-items:center;">
                     <span class="coins">${b.coins} 💰</span>
                     <button class="btn danger small" onclick="deleteBot('${b.id}')">✕</button>
                   </span>
                 </div>`
            )
            .join('')
        : '<p style="color:#999;">Немає ботів</p>';

      // select для оцінок — лише реальні учні
      const sel = document.getElementById('gradeStudent');
      sel.innerHTML = r.students
        .map((s) => `<option value="${s.id}">${s.name}</option>`)
        .join('');
    }

    async function addBotsBulk() {
      const names = document.getElementById('botNames').value;
      const msg = document.getElementById('botMsg');
      msg.textContent = '';
      if (!names.trim()) {
        msg.className = 'error';
        msg.textContent = 'Введіть імена!';
        return;
      }
      const r = await api('/api/bots/bulk', {
        method: 'POST',
        body: JSON.stringify({ names })
      });
      if (r.ok) {
        msg.className = 'success';
        msg.textContent = `✅ Додано ${r.added.length} ботів: ${r.added.join(', ')}`;
        document.getElementById('botNames').value = '';
        refreshClass();
      } else {
        msg.className = 'error';
        msg.textContent = r.message || 'Помилка';
      }
    }

    async function deleteBot(id) {
      if (!confirm('Видалити бота?')) return;
      await api('/api/bots/' + id, { method: 'DELETE' });
      refreshClass();
    }

    async function giveGrade() {
      const studentId = document.getElementById('gradeStudent').value;
      const subject = document.getElementById('gradeSubject').value.trim();
      const grade = document.getElementById('gradeValue').value;
      const comment = document.getElementById('gradeComment').value.trim();
      const msg = document.getElementById('gradeMsg');
      msg.textContent = '';

      if (!studentId || !subject || !grade) {
        msg.className = 'error';
        msg.textContent = 'Заповніть всі поля!';
        return;
      }
      const r = await api('/api/diary/grade', {
        method: 'POST',
        body: JSON.stringify({ studentId, subject, grade, comment })
      });
      if (r.ok) {
        msg.className = 'success';
        msg.textContent = '✅ Оцінку виставлено!';
        document.getElementById('gradeSubject').value = '';
        document.getElementById('gradeValue').value = '';
        document.getElementById('gradeComment').value = '';
      }
    }

    async function addSchedule() {
      const day = document.getElementById('schDay').value.trim();
      const time = document.getElementById('schTime').value.trim();
      const subject = document.getElementById('schSubject').value.trim();
      const homework = document.getElementById('schHw').value.trim();
      const msg = document.getElementById('schMsg');
      msg.textContent = '';
      if (!day || !time || !subject) {
        msg.className = 'error';
        msg.textContent = 'Заповніть день, час та предмет!';
        return;
      }
      const r = await api('/api/schedule', {
        method: 'POST',
        body: JSON.stringify({ day, time, subject, homework })
      });
      if (r.ok) {
        msg.className = 'success';
        msg.textContent = '✅ Додано до розкладу!';
        ['schDay', 'schTime', 'schSubject', 'schHw'].forEach(
          (id) => (document.getElementById(id).value = '')
        );
      }
    }

    (async () => {
      await renderTopbar('/teacher');
      await refreshClass();
    })();
  </script>
</body>
</html>
