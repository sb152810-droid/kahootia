<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Вхід · SunLorem</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-box">
    <h1>🌞 SunLorem</h1>
    <p class="subtitle">Шкільна платформа для 5 класу</p>

    <input id="username" type="text" placeholder="Логін" autocomplete="username" />
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />
    <button class="btn" style="width:100%;" onclick="doLogin()">Увійти</button>
    <p id="msg" class="error"></p>

    <div style="margin-top:20px; font-size:13px; color:#78350f; text-align:left; background:#fef3c7; padding:12px; border-radius:10px;">
      <b>Тестові акаунти:</b><br/>
      👩‍🏫 Вчитель: <code>teacher / teacher123</code><br/>
      🧑‍🎓 Учень: <code>sofia / 1234</code>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');
      msg.textContent = '';

      const r = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      if (!r.ok) {
        msg.textContent = r.message || 'Помилка входу';
        return;
      }
      window.location.href = r.role === 'teacher' ? '/teacher' : '/dashboard';
    }
